version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_ewallet
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ewallet_db
      MYSQL_USER: ewallet_user
      MYSQL_PASSWORD: ewallet_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ewallet_net

volumes:
  mysql_data:
    driver: local

networks:
  ewallet_net:
    driver: bridge
